<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pixi Hex Game</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #1e1e1e;
      }
      /* Toggle button for labels */
      #toggle-labels {
        position: absolute;
        left: 12px;
        top: 12px;
        z-index: 1000;
        padding: 6px 10px;
        font-family: Arial, sans-serif;
        font-size: 13px;
        background: rgba(0,0,0,0.6);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button id="toggle-labels">Hide Labels (L)</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
